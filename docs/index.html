<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Simulate a payment timeout, reconciliation, and concurrent retries.">
  <title>Schrödinger’s Charge</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #101412;
      color: #edf1e9;
      --border: #36423b;
      --muted: #a5b4aa;
      --accent: #d3f588;
      --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 860px; margin: 0 auto; padding: clamp(24px, 6vw, 76px) 24px; }
    h1 { margin: 0; font-size: clamp(2.25rem, 6vw, 4.25rem); line-height: 1; letter-spacing: -.055em; }
    p { color: var(--muted); line-height: 1.55; }
    code, output, li { font-family: var(--mono); overflow-wrap: anywhere; }
    .controls, .actions { display: flex; flex-wrap: wrap; align-items: end; gap: 8px; }
    .controls { margin-top: 32px; gap: 12px; }
    label { display: grid; gap: 6px; font-size: .85rem; color: var(--muted); }
    button, select {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #1e2922;
      color: inherit;
      min-height: 42px;
      padding: 9px 12px;
      font: inherit;
      font-size: .9rem;
    }
    button { cursor: pointer; }
    button:enabled:hover { background: #2e3b32; }
    button.primary:enabled { background: var(--accent); color: #19250c; border-color: var(--accent); font-weight: 700; }
    button:disabled { opacity: .45; cursor: default; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .records { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0 26px; }
    .record, .trace { border: 1px solid var(--border); border-radius: 12px; background: #18201b; }
    .record { padding: 16px; }
    h2 { font-size: .9rem; font-weight: 650; margin: 0; }
    output { display: block; margin-top: 10px; font-size: clamp(1.1rem, 4vw, 1.6rem); }
    output[data-state="pending"] { color: #ffd190; }
    output[data-state="paid"] { color: var(--accent); }
    .trace { padding: 16px; }
    .trace ol { margin: 12px 0 0; padding-left: 26px; }
    .trace li { padding: 4px 0 4px 4px; font-size: .85rem; line-height: 1.5; }
    .trace li::marker { color: var(--muted); }
    .empty, .feedback { margin: 10px 0 0; font-size: .9rem; }
    .feedback[data-error="true"] { color: #ffd190; }
    @media (max-width: 520px) { main { padding-inline: 16px; } label, select { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <h1>Schrödinger’s Charge</h1>
    <p>Send a ₹499 test payment through the Go merchant and mock provider. Follow the SQLite records as the payment recovers.</p>
    <p>Payment ID <code id="payment-id">Loading…</code></p>

    <div class="controls">
      <label for="scenario">Scenario
        <select id="scenario">
          <option value="timeout">Response times out after commit</option>
          <option value="offline">Request fails before commit</option>
          <option value="normal">Provider confirms the charge</option>
        </select>
      </label>
      <div class="actions">
        <button class="primary" id="pay">Pay ₹499</button>
        <button id="reconcile">Reconcile</button>
        <button id="race">Race two retries</button>
        <button id="reset">Reset</button>
      </div>
    </div>

    <div class="records">
      <section class="record">
        <h2>Merchant payment</h2>
        <output id="merchant-state">Loading…</output>
      </section>
      <section class="record">
        <h2>Provider ledger</h2>
        <output id="provider-state">Loading…</output>
      </section>
    </div>

    <section class="trace" aria-labelledby="trace-title">
      <h2 id="trace-title">Request trace</h2>
      <p class="empty" id="empty">Run an action to see the Go request trace.</p>
      <ol id="events" aria-live="polite"></ol>
    </section>
    <p class="feedback" id="feedback" role="status"></p>
  </main>
  <script>
    const scenario = document.querySelector("#scenario");
    const pay = document.querySelector("#pay");
    const reconcile = document.querySelector("#reconcile");
    const race = document.querySelector("#race");
    const reset = document.querySelector("#reset");
    const merchantState = document.querySelector("#merchant-state");
    const providerState = document.querySelector("#provider-state");
    const paymentID = document.querySelector("#payment-id");
    const events = document.querySelector("#events");
    const empty = document.querySelector("#empty");
    const feedback = document.querySelector("#feedback");
    const storageKey = "schrodinger-charge-payment-id";

    let id = sessionStorage.getItem(storageKey) || newPaymentID();
    let state = null;
    let busy = false;

    function newPaymentID() {
      const value = crypto.randomUUID();
      sessionStorage.setItem(storageKey, value);
      return value;
    }

    function render() {
      paymentID.textContent = id;
      const status = state?.merchant_status;
      const count = state?.provider_count;
      merchantState.value = status === "none" ? "No payment" : status || "—";
      merchantState.dataset.state = status || "";
      providerState.value = count === undefined ? "—" : count + (count === 1 ? " charge" : " charges");
      providerState.dataset.state = count ? "paid" : "";
      scenario.disabled = busy || status !== "none";
      pay.disabled = busy || status !== "none";
      reconcile.disabled = busy || !status || status === "none";
      race.disabled = busy || status !== "pending" || count !== 0;
      reset.disabled = busy;
      empty.hidden = events.childElementCount > 0;
    }

    async function run(action = "") {
      busy = true;
      feedback.dataset.error = "false";
      feedback.textContent = "Waiting for the Go backend…";
      render();

      try {
        const options = { method: action ? "POST" : "GET" };
        if (action === "pay") {
          options.headers = { "Content-Type": "application/json" };
          options.body = JSON.stringify({ scenario: scenario.value });
        }
        const path = "/api/demo/" + id + (action ? "/" + action : "");
        const response = await fetch(path, options);
        if (!response.headers.get("Content-Type")?.includes("application/json")) {
          throw new Error((await response.text()).trim() || "The Go backend is unavailable.");
        }

        state = await response.json();
        for (const message of state.events) {
          const item = document.createElement("li");
          item.textContent = message;
          events.append(item);
        }
        if (!response.ok) {
          throw new Error(state.error || "The action failed.");
        }
        feedback.textContent = "";
      } catch (error) {
        feedback.dataset.error = "true";
        feedback.textContent = error.message;
      } finally {
        busy = false;
        render();
      }
    }

    pay.addEventListener("click", () => run("pay"));
    reconcile.addEventListener("click", () => run("reconcile"));
    race.addEventListener("click", () => run("race"));
    reset.addEventListener("click", () => {
      id = newPaymentID();
      state = null;
      events.replaceChildren();
      run();
    });

    run();
  </script>
</body>
</html>
